name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.0
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Install iOS Simulator Runtime
        run: |
          sudo xcodebuild -downloadPlatform iOS

      - name: Build and Test
        run: |
          xcodebuild test \
            -project "RecipeClassifier-Evaluation/RecipeClassifierDemo-Evaluation.xcodeproj" \
            -scheme "RecipeClassifierDemo-Evaluation" \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        env:
          NSUnbufferedIO: YES

      - name: Generate HTML Report
        if: always()
        run: |
          xcrun xccov view \
            --report --json TestResults.xcresult > coverage.json

          xcrun xcresulttool get \
            --path TestResults.xcresult \
            --format json > results.json

          npm install -g xunit-viewer
          xunit-viewer \
            --results results.json \
            --output TestReport.html \
            --title "RecipeClassifier Evaluation Results"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            TestReport.html
