name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.0
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Build and Test
        run: |
          xcodebuild test \
            -project "RecipeClassifier-Evaluation/RecipeClassifierDemo-Evaluation.xcodeproj" \
            -scheme "RecipeClassifierDemo-Evaluation" \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | xcpretty
        env:
          NSUnbufferedIO: YES

      - name: Write Job Summary
        if: always()
        run: |
          echo "## 📊 EvalKit Evaluation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY

          # Extract printed metrics from xcpretty log
          LOG=$(grep -r "EVALKIT REPORT\|Accuracy\|Precision\|Recall\|F1\|Latency Mean\|Verdict" build.log 2>/dev/null || echo "")

          ACCURACY=$(echo "$LOG" | grep "Accuracy" | grep -o '[0-9.]*%' | head -1)
          PRECISION=$(echo "$LOG" | grep "Precision" | grep -o '[0-9.]*%' | head -1)
          RECALL=$(echo "$LOG" | grep "Recall" | grep -o '[0-9.]*%' | head -1)
          F1=$(echo "$LOG" | grep "F1" | grep -o '[0-9.]*%' | head -1)
          LATENCY=$(echo "$LOG" | grep "Latency Mean" | grep -oE '[0-9]+\.[0-9]+ms' | head -1)
          VERDICT=$(echo "$LOG" | grep "Verdict" | sed 's/.*Verdict.*: //' | head -1)

          echo "| Accuracy | ${ACCURACY:-N/A} |" >> $GITHUB_STEP_SUMMARY
          echo "| Precision (macro) | ${PRECISION:-N/A} |" >> $GITHUB_STEP_SUMMARY
          echo "| Recall (macro) | ${RECALL:-N/A} |" >> $GITHUB_STEP_SUMMARY
          echo "| F1 (macro) | ${F1:-N/A} |" >> $GITHUB_STEP_SUMMARY
          echo "| Latency Mean | ${LATENCY:-N/A} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Verdict: ${VERDICT:-See test logs}**" >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
